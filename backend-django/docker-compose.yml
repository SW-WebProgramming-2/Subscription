version: "3.9"

services:
  db:
    image: postgres:16
    container_name: subs_pg
    environment:
      POSTGRES_DB: ${DB_NAME:-subscriptions}        # .env 값 사용
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appsecret}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"                                  # 로컬에서도 접근 가능
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile                         # 백엔드 Django용 Dockerfile
    container_name: subs_backend
    env_file: .env                                   # 환경변수 주입
    depends_on:
      db:
        condition: service_healthy                   # DB가 준비된 뒤에 시작
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app                                       # 로컬 코드 변경 반영(개발용)

volumes:
  pgdata:


redis:
  image: redis:7
  container_name: subs_redis
  ports:
    - "6379:6379"
  volumes:
    - redisdata:/data
  restart: always

volumes:
  redisdata:
