version: '3.9'

services:
  db:
    image: postgres:16
    container_name: subs_pg
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subs_backend
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2
    container_name: subs_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: subs_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  caddy_data:      # Caddy 인증서 및 데이터 저장
  caddy_config:    # Caddy 설정 저장
  redisdata:
